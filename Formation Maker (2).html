header,main{position:relative;z-index:1}
header{padding:18px 20px 6px;max-width:1100px;margin:0 auto}
.title{font:inherit;font-size:22px;font-weight:800;background:transparent;border:0;border-bottom:2px dashed var(--line);color:var(--ink);width:100%;max-width:420px;padding:2px 0;border-radius:0}
.title:focus{outline:none;border-bottom-color:var(--acc)}
textarea{width:100%;min-height:90px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px monospace}
details{margin-top:8px}summary{cursor:pointer;font-size:13px;color:var(--mute);margin-bottom:8px}
.trow{display:flex;gap:6px;align-items:center}.trow .load{flex:1;text-align:left}.trow .load.on{background:var(--acc);color:#fff;border-color:var(--acc)}
header p{margin:4px 0 0;color:var(--mute);font-size:14px}
main{max-width:1100px;margin:0 auto;padding:12px 20px 32px;display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:800px){main{grid-template-columns:1fr}}
.pitch-wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
svg{display:block;width:100%;height:auto;touch-action:none;border-radius:6px;user-select:none}
.player{cursor:grab}
.player.drag{cursor:grabbing}
.locked .player{cursor:default}
.player text{pointer-events:none;font-family:inherit}
.side,.left{display:grid;gap:14px;align-content:start;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
button,select,input{font:inherit;color:var(--ink)}
button,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button.on,.tabs button.on,.ph.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.plist{display:grid;gap:6px}
.p{display:grid;grid-template-columns:10px 56px 1fr;gap:8px;align-items:center;padding:4px 6px;border-radius:8px;border:1px solid transparent}
.p.sub{grid-template-columns:96px 1fr}
.p.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.p input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px}
.p input.num{text-align:center;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:#999}
.p .ref{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p .ref b{color:var(--ink)}
label.c{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc)}
.rtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.rtabs button{text-align:left;padding:7px 9px;line-height:1.3;min-width:0}
.rtabs small{display:block;opacity:.75;font-size:11px}
.rtabs b{font-weight:600;font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsel{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.rsel select{width:100%}
.cat{display:inline-block;color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.hint{color:var(--mute);font-size:13px;margin:0}
.note{color:var(--mute);font-size:12px;margin:8px 0 0}
.hidden{display:none}
.vh{visibility:hidden}
</style>
</head>
<body>
<header>
  <input id="teamName" class="title" maxlength="30" placeholder="Enter Team Name" aria-label="Team name">
  <p>Set positions in the Base Shape, build the In Possession and Out of Possession shapes, then play the transition animation.</p>
</header>
<main>
  <div class="left">
  <div class="pitch-wrap" id="pitchWrap">
    <div class="bar">
      <button class="ph on" data-ph="base">Base Shape</button>
      <button class="ph" data-ph="in">In Possession</button>
      <button class="ph" data-ph="out">Out of Possession</button>
      <button id="play" class="primary">▶ Play Transition</button>
      <select id="spd" aria-label="Speed"><option value="1.6">Slow</option><option value="1" selected>Normal</option><option value="0.6">Fast</option><option value="0.3">Very Fast</option><option value="0.12">Ultra Fast</option></select>
    </div>
    <svg id="pitch" viewBox="0 0 680 1050" xmlns="http://www.w3.org/2000/svg" aria-label="Pitch">
      <g id="field"></g>
      <text id="svgTitle" x="40" y="22" font-size="18" font-weight="800" fill="#fff"></text>
      <g id="players"></g>
    </svg>
  </div>
    <section class="panel" id="teamPanel">
      <h2>My Teams</h2>
      <div class="row"><button id="newTeam" class="primary">+ New Team</button><button id="saveTeam">Save</button><span class="hint" id="saveMsg">Loading…</span></div>
      <div class="plist" id="teamList"></div>
      <p class="note" id="storeNote"></p>
    </section>
  </div>
  <div class="side">
    <section class="panel">
      <h2>Selected Player <span id="catTag"></span></h2>
      <p class="hint" id="roleHint">Click a player on the pitch.</p>
      <div class="hidden" id="roleBox">
        <div class="rtabs">
          <button class="ph on" data-ph="base" id="tBase"></button>
          <button class="ph" data-ph="in" id="tIn"></button>
          <button class="ph" data-ph="out" id="tOut"></button>
        </div>
        <label class="rsel"><span id="rlabel"></span><select id="rsel"></select></label>
        <p class="note" id="rnote"></p>
      </div>
    </section>
    <section class="panel">
      <h2>Formation</h2>

<script>

const EC=c=>EN_CAT[c]||c,ER=n=>EN_ROLE[n]||n;
const R=(n,a)=>({n,a});
const ROLES={
 "골키퍼":{in:[R("골키퍼","GK"),R("스위퍼 키퍼","SK"),R("볼플레잉 골키퍼","BPG")],out:[R("골키퍼","GK"),R("스위퍼 키퍼","SK")]},
 "센터백":{in:[R("노넌센스 센터백","NCB"),R("볼플레잉 센터백","BPD"),R("와이드 센터백","WCB"),R("리베로","LIB"),R("커버","CD")],out:[R("스토퍼","STC"),R("커버","CD"),R("와이드 센터백","WCB"),R("노넌센스 센터백","NCB")]},
 "풀백":{in:[R("풀백","FB"),R("오버래핑 풀백","OFB"),R("인버티드 풀백","IFB"),R("윙백","WB"),R("플레이메이킹 윙백","PWB")],out:[R("풀백","FB"),R("디펜시브 풀백","DFB"),R("윙백","WB"),R("인버티드 풀백","IFB")]},
 "수비형 미드필더":{in:[R("앵커맨","ANC"),R("하프백","HB"),R("딥라잉 플레이메이커","DLP"),R("레지스타","REG"),R("세군도 볼란테","SV")],out:[R("볼위닝 미드필더","BWM"),R("앵커맨","ANC"),R("하프백","HB"),R("디펜시브 미드필더","DMF")]},
 "중앙 미드필더":{in:[R("박스투박스","B2B"),R("메짤라","MEZ"),R("캐리어","CAR"),R("딥라잉 플레이메이커","DLP"),R("센트럴 커넥터","CON")],out:[R("볼위닝 미드필더","BWM"),R("박스투박스","B2B"),R("캐리어","CAR"),R("메짤라","MEZ"),R("센트럴 미드필더(수비)","CMD")]},
 "공격형 미드필더":{in:[R("어드밴스드 플레이메이커","APM"),R("트레콰르티스타","TRQ"),R("엔간체","ENG"),R("섀도 스트라이커","SS"),R("메짤라","MEZ")],out:[R("프레싱 공격형 미드필더","PAM"),R("트랙백 미드필더","TBM"),R("섀도 스트라이커","SS"),R("어드밴스드 플레이메이커","APM")]},
 "윙어":{in:[R("윙어","W"),R("인사이드 포워드","IF"),R("인버티드 윙어","IW"),R("와이드 플레이메이커","WP"),R("와이드 미드필더","WM")],out:[R("프레싱 윙어","PW"),R("트랙백 윙어","TW"),R("와이드 미드필더","WM"),R("인사이드 포워드","IF")]},
 "스트라이커":{in:[R("포처","POA"),R("타겟맨","TM"),R("딥라잉 포워드","DLF"),R("폴스 나인","F9"),R("컴플리트 포워드","CF"),R("어드밴스드 포워드","AF"),R("섀도 스트라이커","SS")],out:[R("프레싱 포워드","PF"),R("딥라잉 포워드","DLF"),R("포처","POA"),R("폴스 나인","F9"),R("섀도 스트라이커","SS")]}
};
const LABEL={base:"기본 포메이션",in:"공격 In",out:"수비 Out"};
// 기본 포메이션 위치로 포지션 분류
function classify(x,y){
  if(y>=86&&x>25&&x<75)return"골키퍼";
  if(x<25||x>75)return y>=52?"풀백":"윙어";
  if(y>=64)return"센터백";
  if(y>=55)return"수비형 미드필더";
  if(y>=44)return"중앙 미드필더";
  if(y>=36)return"공격형 미드필더";
  return"스트라이커";
}
const NS="http://www.w3.org/2000/svg",W=680,H=1050;
const $=id=>document.getElementById(id);
const svg=$("pitch"),layer=$("players");
const players=NUMS.map(n=>({n:String(n),name:"",sub:"",lock:"",cat:"",pos:{base:{x:50,y:50},in:{x:50,y:50},out:{x:50,y:50}},dirty:{in:false,out:false},role:{in:"",out:""}}));
let sel=-1,phase="base",view={a:"base",b:"base",u:0},els=[],rows=[],srows=[],dots=[];
const anim={on:false,start:null};
const clamp=v=>Math.min(97,Math.max(3,v));

(function(){
  const f=$("field");
  const add=(tag,a)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);f.appendChild(e)};
  for(let i=0;i<10;i++)add("rect",{x:0,y:i*105,width:W,height:105,fill:i%2?"#2f8a4b":"#2a7d43"});
  const L={stroke:"#fff","stroke-width":3,fill:"none","stroke-opacity":.9};
  add("rect",{x:30,y:30,width:620,height:990,...L});
  add("line",{x1:30,y1:525,x2:650,y2:525,...L});
  add("circle",{cx:340,cy:525,r:91.5,...L});
  add("circle",{cx:340,cy:525,r:5,fill:"#fff"});
  [[30,1],[1020,-1]].forEach(([y,d])=>{
    add("rect",{x:138.5,y:d>0?y:y-165,width:403,height:165,...L});
    add("rect",{x:248.5,y:d>0?y:y-55,width:183,height:55,...L});
    add("circle",{cx:340,cy:y+d*110,r:5,fill:"#fff"});
    add("path",{d:`M 267 ${y+d*165} A 91.5 91.5 0 0 ${d>0?0:1} 413 ${y+d*165}`,...L});
  });
})();

players.forEach((p,i)=>{
  const g=document.createElementNS(NS,"g");g.setAttribute("class","player");
  g.innerHTML=`<circle r="30" class="ring" fill="none" stroke="#ffe066" stroke-width="5" opacity="0"/>
  <circle r="26" class="body" stroke-width="3"/>
  <text class="no" text-anchor="middle" dy="8" font-size="24" font-weight="800"></text>
  <g class="tag"><rect y="-62" height="24" rx="7" stroke="#fff" stroke-width="2"/><text class="tt" text-anchor="middle" y="-44" font-size="16" font-weight="800" fill="#fff"></text></g>
  <text class="nm" text-anchor="middle" y="52" font-size="22" font-weight="700" fill="#fff" stroke="rgba(0,0,0,.65)" stroke-width="5" paint-order="stroke"></text>
  <text class="sb" text-anchor="middle" y="75" font-size="16" font-weight="600" fill="#e9eee9" stroke="rgba(0,0,0,.6)" stroke-width="4" paint-order="stroke"></text>`;
  layer.appendChild(g);els.push(g);
  g.addEventListener("pointerdown",e=>{
    if(anim.on)stopAnim();
    select(i);
    g.setAttribute("class","player drag");g.setPointerCapture(e.pointerId);
    const move=ev=>{
      const r=svg.getBoundingClientRect();
      const q=p.pos[phase];
      q.x=clamp((ev.clientX-r.left)/r.width*100);
      q.y=clamp((ev.clientY-r.top)/r.height*100);
      if(phase==="base"){
        if(!p.dirty.in)p.pos.in=deriveIn(i);
        if(!p.dirty.out)p.pos.out=deriveOut(i);
        if(recat(i)&&i===sel)showRole();
      }else p.dirty[phase]=true;
      render();
    };
    const up=()=>{g.setAttribute("class","player");g.removeEventListener("pointermove",move);g.removeEventListener("pointerup",up);g.removeEventListener("pointercancel",up)};
    g.addEventListener("pointermove",move);g.addEventListener("pointerup",up);g.addEventListener("pointercancel",up);
  });
});

players.forEach((p,i)=>{
  const r=document.createElement("div");r.className="p";
  r.innerHTML=`<span class="dot"></span><input class="num" inputmode="numeric" maxlength="2" aria-label="Shirt number"><input class="nm" maxlength="12" placeholder="Name" aria-label="Name">`;
  $("plist").appendChild(r);rows.push(r);dots.push(r.querySelector(".dot"));
  const [n,nm]=r.querySelectorAll("input");
  n.addEventListener("input",()=>{p.n=n.value;paintBase();refSub(i);if(i===sel)showRole()});
  nm.addEventListener("input",()=>{p.name=nm.value;paintBase();refSub(i);if(i===sel)showRole()});
  r.addEventListener("focusin",()=>{if(anim.on)stopAnim();select(i)});
  const s=document.createElement("div");s.className="p sub";
  s.innerHTML=`<span class="ref"></span><input maxlength="12" placeholder="Sub Name" aria-label="Sub name">`;
  $("slist").appendChild(s);srows.push(s);
  s.querySelector("input").addEventListener("input",e=>{p.sub=e.target.value;paintBase()});
  s.addEventListener("focusin",()=>{if(anim.on)stopAnim();select(i)});
});

function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function refSub(i){srows[i].querySelector(".ref").innerHTML=`<b>${esc(players[i].n)}</b> ${esc(players[i].name)}`}
function roleOf(p,ph){return ROLES[p.cat][ph].find(r=>r.n===p.role[ph])}
// 포지션은 기본 포메이션 위치(또는 고정값)로만 결정
function recat(i){
  const p=players[i],c=p.lock||classify(p.pos.base.x,p.pos.base.y);
  if(c===p.cat)return false;
  p.cat=c;p.role.in="";p.role.out="";return true;
}
function deriveIn(i){
  const a=players[i].pos.base;
  return i===0?{x:a.x,y:a.y}:{x:clamp(50+(a.x-50)*1.06),y:clamp(a.y-6)};
}
function deriveOut(i){
  const a=players[i].pos.base;
  return i===0?{x:a.x,y:a.y}:{x:50+(a.x-50)*.8,y:Math.min(95,44+(a.y-22)*(30/54))};
}
const dist=(a,b)=>{const f=h=>[1,3,5].map(k=>parseInt(h.slice(k,k+2),16));const x=f(a),y=f(b);return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])};
const lum=h=>{const c=[1,3,5].map(k=>parseInt(h.slice(k,k+2),16));return .299*c[0]+.587*c[1]+.114*c[2]};
const kit=$("kit"),kitText=$("kitText"),gkKit=$("gkKit");
function ensureGK(){
  if(dist(gkKit.value,kit.value)<110){
    const c=["#f2c230","#1d9bf0","#2ecc71","#ff7a00","#111111","#ffffff"];
    gkKit.value=c.reduce((b,x)=>dist(x,kit.value)>dist(b,kit.value)?x:b,c[0]);
  }
}
function paintBase(){
  ensureGK();
  players.forEach((p,i)=>{
    const g=els[i],gk=i===0;
    const fill=gk?gkKit.value:kit.value,ink=gk?(lum(fill)>150?"#111111":"#ffffff"):kitText.value;
    const b=g.querySelector(".body");b.setAttribute("fill",fill);b.setAttribute("stroke",ink);
    const no=g.querySelector(".no");no.textContent=p.n;no.setAttribute("fill",ink);
    g.querySelector(".nm").textContent=p.name;
    g.querySelector(".sb").textContent=$("showSub").checked&&p.sub?p.sub:"";
  });
}
function render(){
  const {a,b,u}=view,dp=u<.5?a:b;
  players.forEach((p,i)=>{
    const A=p.pos[a],B=p.pos[b];
    const x=A.x+(B.x-A.x)*u,y=A.y+(B.y-A.y)*u;
    els[i].setAttribute("transform",`translate(${x/100*W} ${y/100*H})`);
    const tag=els[i].querySelector(".tag");
    tag.style.display=$("showRoles").checked?"":"none";
    const r=dp==="base"?null:roleOf(p,dp);
    const txt=r?r.a:CODE[p.cat];
    const tt=tag.querySelector(".tt");tt.textContent=txt;
    const w=txt.length*11+18,rc=tag.querySelector("rect");
    rc.setAttribute("x",-w/2);rc.setAttribute("width",w);rc.setAttribute("fill",COL[p.cat]);
    tag.setAttribute("opacity",dp==="base"||r?1:.6);
    dots[i].style.background=COL[p.cat];
  });
  document.querySelectorAll(".ph").forEach(bn=>bn.classList.toggle("on",bn.dataset.ph===dp));
  $("kitRow").classList.toggle("vh",dp!=="base");$("showRow").classList.toggle("vh",dp!=="base");
  markChip();
}
[kit,kitText,gkKit,$("showSub")].forEach(e=>e.addEventListener("input",paintBase));
$("showRoles").addEventListener("input",render);

const rsel=$("rsel");
function showRole(){
  const p=players[sel];
  if(!p){$("roleBox").classList.add("hidden");$("roleHint").classList.remove("hidden");$("catTag").innerHTML="";return}
  $("roleHint").classList.add("hidden");$("roleBox").classList.remove("hidden");
  const c=p.cat;
  $("catTag").innerHTML=`<span>#${esc(p.n)} ${esc(p.name)}</span><span class="cat" style="background:${COL[c]}">${EC(c)}</span>`;
  const rn=ph=>{const r=roleOf(p,ph);return r?`${ER(r.n)} (${r.a})`:"No Role Set"};
  $("tBase").innerHTML=`<small>Base</small><b>${EC(c)}</b>`;
  $("tIn").innerHTML=`<small>In Possession</small><b>${esc(rn("in"))}</b>`;
  $("tOut").innerHTML=`<small>Out of Possession</small><b>${esc(rn("out"))}</b>`;
  rsel.innerHTML="";
  const opt=(v,tx)=>{const o=document.createElement("option");o.value=v;o.textContent=tx;rsel.appendChild(o)};
  if(phase==="base"){
    $("rlabel").textContent="Position Lock";
    opt("","Auto (From Base Position)");CATS.forEach(k=>opt(k,EC(k)));
    rsel.value=p.lock;
    $("rnote").textContent="The position set here stays fixed when you move the player in the In Possession and Out of Possession tabs.";
  }else{
    $("rlabel").textContent=phase==="in"?"In-Possession Role":"Out-of-Possession Role";
    opt("","Select Role");ROLES[c][phase].forEach(r=>opt(r.n,`${ER(r.n)} (${r.a})`));
    rsel.value=p.role[phase];
    $("rnote").textContent=`Position: ${EC(c)} · fixed from the Base Shape.`;
  }
}
rsel.onchange=()=>{
  if(sel<0)return;const p=players[sel];
  if(phase==="base"){p.lock=rsel.value;recat(sel)}
  else p.role[phase]=rsel.value;
  showRole();render();
};
function select(i){
  sel=i;
  els.forEach((g,k)=>g.querySelector(".ring").setAttribute("opacity",k===i?1:0));
  rows.forEach((r,k)=>r.classList.toggle("sel",k===i));
  srows.forEach((r,k)=>r.classList.toggle("sel",k===i));
  showRole();
}
function setPhase(ph){
  if(anim.on)stopAnim(false);
  phase=ph;view={a:ph,b:ph,u:0};render();showRole();
}
document.querySelectorAll(".ph").forEach(b=>b.addEventListener("click",()=>setPhase(b.dataset.ph)));

const forms={base:"",in:"",out:""};
function markChip(){
  const dp=view.u<.5?view.a:view.b;
  document.querySelectorAll("#chips button").forEach(b=>b.classList.toggle("on",b.textContent===forms[dp]));
}
function apply(key,ph="base"){
  forms[ph]=key;
  FORMATIONS[key].forEach(([x,y],i)=>{
    const p=players[i];p.pos[ph]={x,y};
    if(ph==="base"){p.lock="";recat(i)}else p.dirty[ph]=true;
  });
  if(ph==="base")players.forEach((p,i)=>{if(!p.dirty.in)p.pos.in=deriveIn(i);if(!p.dirty.out)p.pos.out=deriveOut(i)});
  render();showRole();
}
Object.keys(FORMATIONS).forEach(k=>{
  const b=document.createElement("button");b.textContent=k;b.onclick=()=>{if(anim.on)stopAnim(false);apply(k,phase)};$("chips").appendChild(b);
});

// 전환 애니메이션: 기본 → 공격 → (공격 ↔ 수비 반복)
const ease=v=>v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2;
function frame(ts){
  if(!anim.on)return;
  const mult=parseFloat($("spd").value),move=2600*mult,hold=300+900*Math.min(1,mult);
  if(anim.start===null)anim.start=ts;
  const tt=ts-anim.start;
  if(tt<hold)view={a:"base",b:"base",u:0};
  else if(tt<hold+move)view={a:"base",b:"in",u:ease((tt-hold)/move)};
  else{
    const k=(tt-hold-move)%(2*(hold+move));
    if(k<hold)view={a:"in",b:"in",u:0};
    else if(k<hold+move)view={a:"in",b:"out",u:ease((k-hold)/move)};
    else if(k<2*hold+move)view={a:"out",b:"out",u:0};
    else view={a:"out",b:"in",u:ease((k-2*hold-move)/move)};
  }
  render();
  requestAnimationFrame(frame);
}
function startAnim(){
  anim.on=true;anim.start=null;
  $("play").textContent="■ Stop";$("pitchWrap").classList.add("locked");
  requestAnimationFrame(frame);
}
function stopAnim(redraw=true){
  anim.on=false;
  phase=view.u<.5?view.a:view.b;view={a:phase,b:phase,u:0};
  $("play").textContent="▶ Play Transition";$("pitchWrap").classList.remove("locked");
  if(redraw){render();showRole()}
}
$("play").onclick=()=>anim.on?stopAnim():startAnim();

function serialize(){
  return {v:1,teamName:teamName.value,kit:kit.value,kitText:kitText.value,gkKit:gkKit.value,
    showRoles:$("showRoles").checked,showSub:$("showSub").checked,form:forms.base,formIn:forms.in,formOut:forms.out,

function loadState(d){
  if(!d||!Array.isArray(d.players)||d.players.length!==11)throw new Error("Invalid team data");
  if(anim.on)stopAnim(false);
  d.players.forEach((q,i)=>{
    const p=players[i],c=JSON.parse(JSON.stringify(q));
    p.n=String(c.n??"");p.name=c.name||"";p.sub=c.sub||"";p.lock=c.lock||"";
    p.pos=c.pos;p.dirty=c.dirty||{in:false,out:false};p.role=c.role||{in:"",out:""};
    p.cat=CATS.includes(c.cat)?c.cat:"";if(!p.cat)recat(i);
  });
  teamName.value=d.teamName||"";kit.value=d.kit||kit.value;kitText.value=d.kitText||kitText.value;gkKit.value=d.gkKit||gkKit.value;
  $("showRoles").checked=d.showRoles!==false;$("showSub").checked=d.showSub!==false;
  forms.base=d.form||"";forms.in=d.formIn||"";forms.out=d.formOut||"";onName();syncInputs();paintBase();
  phase="base";view={a:"base",b:"base",u:0};render();showRole();
}
function resetAll(){
  if(anim.on)stopAnim(false);
  players.forEach((p,i)=>{p.n=String(NUMS[i]);p.name="";p.sub="";p.lock="";p.cat="";p.role={in:"",out:""};p.dirty={in:false,out:false}});
  kit.value="#d62839";kitText.value="#ffffff";gkKit.value="#f2c230";teamName.value="";
  $("showRoles").checked=true;$("showSub").checked=true;
  forms.in="";forms.out="";apply("4-3-3","base");onName();syncInputs();paintBase();
  phase="base";view={a:"base",b:"base",u:0};render();showRole();
}

// 저장소: 가능하면 아티팩트 데이터베이스(내 계정 전용), 아니면 브라우저 저장소
function localBackend(){
  const mem={};
  const g=k=>{try{return localStorage.getItem(k)}catch(e){return mem[k]??null}};
  const st=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){mem[k]=v}};
  const all=()=>{try{return JSON.parse(g("fm2-teams")||"{}")}catch(e){return{}}};
  return{
    kind:"local",
    async list(){const T=all();return Object.keys(T).map(id=>({id,name:T[id].name,updated:T[id].updated}))},
    async get(id){const t=all()[id];return t?JSON.parse(t.state):null},
    async save(id,name,state){const T=all();T[id]={name,updated:Date.now(),state:JSON.stringify(state)};st("fm2-teams",JSON.stringify(T))},
    async del(id){const T=all();delete T[id];st("fm2-teams",JSON.stringify(T))},
    async getMeta(){return g("fm2-meta")},
    async setMeta(id){st("fm2-meta",id)},
    async getSeed(){return g("fm2-seed")},
    async setSeed(v){st("fm2-seed",v)}
  };
}
function dbBackend(db,uid){
  const col=db.collection("data/users/"+uid);
  return{
    kind:"db",
    async list(){
      const snap=await col.get();
      return snap.docs.filter(d=>d.id.startsWith("team_")).map(d=>({id:d.id,name:d.data().name,updated:d.data().updated}));
    },
    async get(id){const d=await col.doc(id).get();return d.exists?JSON.parse(d.data().state):null},
    async save(id,name,state){await col.doc(id).set({name,updated:Date.now(),state:JSON.stringify(state)})},
    async del(id){await col.doc(id).delete()},
    async getMeta(){const d=await col.doc("meta").get();return d.exists?d.data().active:null},
    async setMeta(id){await col.doc("meta").set({active:id})},
    async getSeed(){const d=await col.doc("seed").get();return d.exists?d.data().v:null},
    async setSeed(v){await col.doc("seed").set({v})}
  };
}
async function initBackend(){
  try{
    if(window.claude&&window.claude.use){
      const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
      const uid=user?await user.id():null;
      if(db&&uid)return dbBackend(db,uid);
    }
  }catch(e){}
  return localBackend();
}

let backend=null,activeId=null,cache={},lastSave="",blankJson="",ready=false,busy=false;
const newId=()=>"team_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const status=m=>{$("saveMsg").textContent=m};
function drawList(){
  const L=$("teamList");L.innerHTML="";
  const ids=Object.keys(cache).sort();
  ids.forEach(id=>{
    const r=document.createElement("div");r.className="trow";
    const b=document.createElement("button");b.className="load"+(id===activeId?" on":"");b.textContent=(["이름 없는 팀","Unnamed team"].includes(cache[id].name)?"Unnamed Team":cache[id].name)||"Unnamed Team";
    b.onclick=()=>{if(id!==activeId)openTeam(id)};
    const d=document.createElement("button");d.textContent="Delete";
    d.onclick=()=>{
      if(d.dataset.arm){removeTeam(id);return}
      d.dataset.arm=1;d.textContent="Confirm Delete?";setTimeout(()=>{d.dataset.arm="";d.textContent="Delete"},3000);
    };
    r.append(b,d);L.appendChild(r);
  });
}
async function saveNow(manual){
  if(!ready||busy)return;
  const st=serialize(),j=JSON.stringify(st);
  if(!activeId){
    if(!manual&&j===blankJson)return;
    activeId=newId();lastSave="";
  }
  if(!manual&&j===lastSave)return;
  busy=true;
  try{
    const name=teamName.value.trim()||"Unnamed Team",id=activeId;
    await backend.save(id,name,st);
    lastSave=j;cache[id]={name,updated:Date.now()};drawList();
    status("Saved "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}));
  }catch(e){status("Save failed: "+(e.message||e.code||"unknown error"))}
  busy=false;
}
async function openTeam(id){
  await saveNow();
  try{
    const st=await backend.get(id);
    if(!st){delete cache[id];drawList();status("Team not found");return}
    loadState(st);activeId=id;lastSave=JSON.stringify(serialize());
    await backend.setMeta(id);drawList();status("Loaded");
  }catch(e){status("Load failed: "+(e.message||e.code))}
}
function blankTeam(){
  resetAll();activeId=null;lastSave="";blankJson=JSON.stringify(serialize());drawList();
}
async function createTeam(){
  await saveNow();
  blankTeam();teamName.focus();
}
async function removeTeam(id){
  try{await backend.del(id)}catch(e){status("Delete failed");return}
  delete cache[id];
  if(id===activeId)blankTeam();
  drawList();
}
