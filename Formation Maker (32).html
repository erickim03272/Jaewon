@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body::before{opacity:.3}}
:root[data-theme="dark"] body::before{opacity:.3}
header,main{position:relative;z-index:1}
header{padding:18px 20px 6px;max-width:1100px;margin:0 auto}
.title{font:inherit;font-size:22px;font-weight:800;background:transparent;border:0;border-bottom:2px dashed var(--line);color:var(--ink);width:100%;max-width:420px;padding:2px 0;border-radius:0}
.title:focus{outline:none;border-bottom-color:var(--acc)}
textarea{width:100%;min-height:90px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px monospace}
details{margin-top:8px}summary{cursor:pointer;font-size:13px;color:var(--mute);margin-bottom:8px}
.trow{display:flex;gap:6px;align-items:center}.trow .load{flex:1;text-align:left}.trow .load.on{background:var(--acc);color:#fff;border-color:var(--acc)}
header p{margin:4px 0 0;color:var(--mute);font-size:14px}
main{max-width:1100px;margin:0 auto;padding:12px 20px 32px;display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:800px){main{grid-template-columns:1fr}}
.pitch-wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
svg{display:block;width:100%;height:auto;touch-action:none;border-radius:6px;user-select:none}
.player{cursor:grab}
.player.drag{cursor:grabbing}
.locked .player{cursor:default}
.player text{pointer-events:none;font-family:inherit}
.side,.left{display:grid;gap:14px;align-content:start;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
button,select,input{font:inherit;color:var(--ink)}
button,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button.on,.tabs button.on,.ph.on,.sbtn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.plist{display:grid;gap:6px}
.p{display:grid;grid-template-columns:10px 1fr 34px;gap:8px;align-items:center;padding:4px 6px;border-radius:8px;border:1px solid transparent}
.p.sub{grid-template-columns:96px 1fr 34px}.p.pr{grid-template-columns:38px 44px 1fr 28px 28px;gap:6px}.p.pr input{padding:6px}.pl{font-size:12px;font-weight:800}.p.sq{grid-template-columns:52px 1fr 56px 30px}.p select{width:100%;padding:6px 8px}.p button{padding:4px 0}
.p.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.p input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px}
.p input.num{text-align:center;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:#999}
.p .ref{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p .ref b{color:var(--ink)}
label.c{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc)}
.rtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.rtabs button{text-align:left;padding:7px 9px;line-height:1.3;min-width:0}
.rtabs small{display:block;opacity:.75;font-size:11px}
.rtabs b{font-weight:600;font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsel{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.rsel select{width:100%}
.cat{display:inline-block;color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
#rnote{min-height:16px;line-height:16px}
.menu{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:4px;max-height:min(300px,60vh);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;min-width:220px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px}
.menu button:hover{background:var(--bg)}.menu button.cur{font-weight:700;color:var(--acc)}
#catTag .cat{margin-left:10px}
.chips button.inh{border-color:var(--acc);color:var(--acc);font-weight:700}
#save{background:#111;border:1px solid #4a4a4a;color:#fff}#save:hover{border-color:#fff}
#qlist{max-height:var(--qh,520px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-right:4px}
.p.sq{grid-template-columns:52px 1fr 118px 30px}.p.sq .stat{padding:5px 6px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addsub{margin:2px 0 6px 6px;padding:4px 10px;font-size:12px;justify-self:start}.p.extra{margin-left:12px}
.grip{cursor:grab;touch-action:none;color:var(--mute);padding:0 6px;user-select:none;font-size:16px}.trow.dragging{opacity:.75;outline:2px solid var(--acc);border-radius:8px}
.hint{color:var(--mute);font-size:13px;margin:0}
.note{color:var(--mute);font-size:12px;margin:8px 0 0}
.hidden{display:none}
.vh{visibility:hidden}
#mode{width:190px}#spd{width:110px}.pitch-wrap .bar:has(#mode){flex-wrap:nowrap}.pitch-wrap .bar:has(#mode) button{white-space:nowrap}
</style>
</head>

function markChip(){
  const dp=view.u<.5?view.a:view.b;

  if(!key&&dp!=="base"){   // 직접 정하지 않은 단계: 같은 쪽에서 가장 가까이 정한 단계(없으면 기본 포메이션)의 포메이션을 따라감
    const GL=G(dp)==="in"?IN_PH:OUT_PH,k=GL.indexOf(dp);
    let best=null,bd=9;GL.forEach((q,j)=>{if(forms[q]){const d=Math.abs(j-k);if(d<bd){bd=d;best=q}}});
    key=best?forms[best]:forms.base;inh=true;
  }
  document.querySelectorAll("#chips button").forEach(b=>{const on=!!key&&b.textContent===key;b.classList.toggle("on",on&&!inh);b.classList.toggle("inh",on&&inh)});
}
function apply(key,ph="base",identity=false){
  forms[ph]=key;
  const T=FORMATIONS[key];
  let map=T.map((_,k)=>k);
  if(!identity){   // 슬롯 순서가 아니라, 현재 기본 포메이션에서 각 선수가 서 있는 위치와 가장 가까운 자리에 배정
    const ref=players.map(p=>p.pos.base);
    const cost=[];for(let i=1;i<11;i++)cost.push(T.slice(1).map(([x,y])=>Math.hypot((ref[i].x-x)/100*W,(ref[i].y-y)/100*H)));
    map=[0,...hungarian(cost).map(j=>j+1)];
  }
  const pts=players.map((_,i)=>{const [x,y]=T[map[i]];return ph==="base"?{x,y}:shapeFrom({x,y},i,ph)});
  if(ph!=="base")relax(pts,pts.map((_,i)=>i===0));
  players.forEach((p,i)=>{
    if(ph==="base"){p.pos.base=pts[i];p.lock="";recat(i)}
    else{p.pos[ph]=pts[i];p.dirty[ph]=true;p.pin[ph]=false;delete p.adj[ph]}   // 포메이션 선택: 고정(pin) 아님 → 역할에 따른 구조 조정은 받음
  });
  if(ph==="base")deriveAll();
  render();showRole();
}

const ease=v=>v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2;
function setupAnim(){
  const m=$("mode").value;bx=0;anim.kind="seq";anim.intro=false;
  if(m==="full"){anim.seq=["i1","i2","i3","o3","o2","o1"];anim.intro=true}
  else if(m==="in")anim.seq=["i1","i2","i3","i2"];
  else if(m==="out")anim.seq=["o3","o2","o1","o2"];
  else if(m==="switch")anim.seq=["i2","o2"];
  else{
    anim.kind="shift";anim.ph=G(phase)==="out"?phase:"o1";
  }
}
function frame(ts){
  if(!anim.on)return;
  const mult=parseFloat($("spd").value),hold=300+900*Math.min(1,mult);
  if(anim.start===null)anim.start=ts;
  let tt=ts-anim.start;
  if(anim.kind==="shift"){
    const mv=1800*mult,h=250+500*Math.min(1,mult),S=[0,1,0,-1],n=S.length,cyc=h+mv;
    const k=tt%(n*cyc),i=Math.floor(k/cyc),r=k%cyc;
    bx=r<h?S[i]:S[i]+(S[(i+1)%n]-S[i])*ease((r-h)/mv);
    view={a:anim.ph,b:anim.ph,u:0};
  }else{
    const move=2600*mult,st=anim.seq,n=st.length;
    let done=false;
    if(anim.intro){
      if(tt<hold){view={a:"base",b:"base",u:0};done=true}
      else if(tt<hold+move){view={a:"base",b:st[0],u:ease((tt-hold)/move)};done=true}
      else tt-=hold+move;
    }
    if(!done){
      const cyc=hold+move,k=tt%(n*cyc),i=Math.floor(k/cyc),r=k%cyc;
      view=r<hold?{a:st[i],b:st[i],u:0}:{a:st[i],b:st[(i+1)%n],u:ease((r-hold)/move)};
    }
  }
  render();
  requestAnimationFrame(frame);
}
function startAnim(){
  setupAnim();anim.on=true;anim.start=null;
  $("play").textContent="■ Stop";$("pitchWrap").classList.add("locked");
  requestAnimationFrame(frame);
}
function stopAnim(redraw=true){
  anim.on=false;bx=0;
  phase=view.u<.5?view.a:view.b;view={a:phase,b:phase,u:0};
  if(G(phase)!=="base")lastSub[G(phase)]=phase;
  $("play").textContent="▶ Play Animation";$("pitchWrap").classList.remove("locked");
  if(redraw){render();showRole()}
}
$("play").onclick=()=>anim.on?stopAnim():startAnim();

function loadState(d){

  squad=[];entN=0;
  if(hasSquad){squad=d.squad.map(e=>({id:String(e.id),n:String(e.n??""),name:e.name||""}));entN=Math.max(0,...squad.map(e=>parseInt(String(e.id).replace(/\D/g,""))||0))}

    if(cp.in&&!cp.i2){pos.i2=cp.in;dirty.i2=!!cd.in}   // 이전 버전 데이터 변환
    if(cp.out&&!cp.o2){pos.o2=cp.out;dirty.o2=!!cd.out}

    p.pos=pos;p.dirty=dirty;p.pin=c.pin||{};p.adj={};p.role=c.role||{in:"",out:""};if(p.role.in==="AM")p.role.in="Attacking Midfielder";   // 옛 이름 변환
    
    p.cat=CATS.includes(c.cat)?c.cat:"";if(!p.cat)recat(i);

    deriveAll(i);

// 저장소: 가능하면 아티팩트 데이터베이스(내 계정 전용), 아니면 브라우저 저장소
function localBackend(){
  const mem={};
  const g=k=>{try{return localStorage.getItem(k)}catch(e){return mem[k]??null}};
  const st=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){mem[k]=v}};
  const all=()=>{try{return JSON.parse(g("fm2-teams")||"{}")}catch(e){return{}}};
  return{
    kind:"local",
    async list(){const T=all();return Object.keys(T).map(id=>({id,name:T[id].name,updated:T[id].updated}))},
    async get(id){const t=all()[id];return t?JSON.parse(t.state):null},
    async save(id,name,state){const T=all();T[id]={name,updated:Date.now(),state:JSON.stringify(state)};st("fm2-teams",JSON.stringify(T))},
    async del(id){const T=all();delete T[id];st("fm2-teams",JSON.stringify(T))},
    async getMeta(){return g("fm2-meta")},
    async setMeta(id){st("fm2-meta",id)},
    async getSeed(){return g("fm2-seed")},
    async setSeed(v){st("fm2-seed",v)},
    async getOrder(){try{return JSON.parse(g("fm2-order")||"[]")}catch(e){return[]}},
    async setOrder(a){st("fm2-order",JSON.stringify(a))}
  };
}
function dbBackend(db,uid){
  const col=db.collection("data/users/"+uid);
  return{
    kind:"db",
    async list(){
      const snap=await col.get();
      return snap.docs.filter(d=>d.id.startsWith("team_")).map(d=>({id:d.id,name:d.data().name,updated:d.data().updated}));
    },
    async get(id){const d=await col.doc(id).get();return d.exists?JSON.parse(d.data().state):null},
    async save(id,name,state){await col.doc(id).set({name,updated:Date.now(),state:JSON.stringify(state)})},
    async del(id){await col.doc(id).delete()},
    async getMeta(){const d=await col.doc("meta").get();return d.exists?d.data().active:null},
    async setMeta(id){await col.doc("meta").set({active:id})},
    async getSeed(){const d=await col.doc("seed").get();return d.exists?d.data().v:null},
    async setSeed(v){await col.doc("seed").set({v})},
    async getOrder(){const d=await col.doc("order").get();try{return d.exists?JSON.parse(d.data().ids):[]}catch(e){return[]}},
    async setOrder(a){await col.doc("order").set({ids:JSON.stringify(a)})}
  };
}
async function initBackend(){
  try{
    if(window.claude&&window.claude.use){
      const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
      const uid=user?await user.id():null;
      if(db&&uid)return dbBackend(db,uid);
    }
  }catch(e){}
  return localBackend();
}

let order=[],backend=null,activeId=null,cache={},lastSave="",blankJson="",ready=false,busy=false;
const newId=()=>"team_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const status=m=>{$("saveMsg").textContent=m};
function drawList(){
  const L=$("teamList");L.innerHTML="";
  const ids=Object.keys(cache).sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?1e9:ia)-(ib<0?1e9:ib)||(a<b?-1:1)});
  ids.forEach(id=>{
    const r=document.createElement("div");r.className="trow";r.dataset.id=id;
    const grip=document.createElement("span");grip.className="grip";grip.textContent="⠿";grip.title="Drag to reorder";
    grip.addEventListener("pointerdown",e=>{   // 드래그로 팀 순서 바꾸기
      e.preventDefault();r.classList.add("dragging");
      const mv=ev=>{
        let before=null;
        for(const x of [...L.children].filter(x=>x!==r)){const b=x.getBoundingClientRect();if(ev.clientY<b.top+b.height/2){before=x;break}}
        if(before!==r.nextSibling)L.insertBefore(r,before);
      };
      const up=()=>{
        window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up);
        r.classList.remove("dragging");
        order=[...L.children].map(x=>x.dataset.id);
        try{Promise.resolve(backend.setOrder(order)).catch(()=>{})}catch(e){}
      };
      window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);
    });

    const b=document.createElement("button");b.className="load"+(id===activeId?" on":"");b.textContent=(["이름 없는 팀","Unnamed team","Unnamed Team"].includes(cache[id].name)?"New Team":cache[id].name)||"New Team";
    b.onclick=()=>{if(id!==activeId)openTeam(id)};
    const d=document.createElement("button");d.textContent="Delete";
    d.onclick=()=>{
      if(d.dataset.arm){removeTeam(id);return}
      d.dataset.arm=1;d.textContent="Confirm Delete?";setTimeout(()=>{d.dataset.arm="";d.textContent="Delete"},3000);
    };
    r.append(grip,b,d);L.appendChild(r);
  });
  fitSquad();
}
async function saveNow(manual){
  if(!ready||busy)return;
  const st=serialize(),j=JSON.stringify(st);
  if(!activeId){
    if(!manual&&j===blankJson)return;
    activeId=newId();lastSave="";
  }
  if(!manual&&j===lastSave)return;
  busy=true;
  try{
    const name=teamName.value.trim()||"New Team",id=activeId;
    await backend.save(id,name,st);
    lastSave=j;cache[id]={name,updated:Date.now()};drawList();
    status("Saved "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}));
  }catch(e){status("Save failed: "+(e.message||e.code||"unknown error"))}
  busy=false;
}
async function openTeam(id){
  await saveNow();
  try{
    const st=await backend.get(id);
    if(!st){delete cache[id];drawList();status("Team not found");return}
    loadState(st);activeId=id;lastSave=JSON.stringify(serialize());
    await backend.setMeta(id);drawList();status("Loaded");
  }catch(e){status("Load failed: "+(e.message||e.code))}
}
function blankTeam(){
  resetAll();activeId=null;lastSave="";blankJson=JSON.stringify(serialize());drawList();
}
async function createTeam(){
  await saveNow();
  blankTeam();activeId=newId();lastSave="";
  await saveNow(true);                 // 이름을 안 정해도 "New Team"으로 목록에 바로 나타남
  teamName.focus();
}
async function removeTeam(id){
  try{await backend.del(id)}catch(e){status("Delete failed");return}
  delete cache[id];
  if(id===activeId)blankTeam();
  drawList();
}
async function dupTeam(){
  if(!ready)return;
  await saveNow();
  const nm=(teamName.value.trim()||"New Team")+" Copy",st=serialize();st.teamName=nm;
  const id=newId();
  try{await backend.save(id,nm,st)}catch(e){status("Duplicate failed");return}
  cache[id]={name:nm,updated:Date.now()};
  loadState(st);activeId=id;lastSave=JSON.stringify(serialize());
  try{await backend.setMeta(id)}catch(e){}
  drawList();status("Duplicated");
}
$("dupTeam").onclick=dupTeam;
$("newTeam").onclick=()=>{if(ready)createTeam()};
$("saveTeam").onclick=()=>saveNow(true);

syncInputs();paintBase();apply("4-3-3","base",true);onName();
(async()=>{
  backend=await initBackend();
  $("storeNote").textContent=backend.kind==="db"?"Teams are saved to your account, so they stay when you reopen the page or switch devices. Changes save automatically.":"";
  try{order=await backend.getOrder()}catch(e){order=[]}
  try{
    (await backend.list()).forEach(t=>{cache[t.id]={name:t.name||"New Team",updated:t.updated}});
    if((await backend.getSeed())!==SEED_TAG){
      await backend.save(SEED_ID,SEED.teamName,SEED);await backend.setSeed(SEED_TAG);
      cache[SEED_ID]={name:SEED.teamName,updated:Date.now()};
    }
  }catch(e){status("Load failed: "+(e.message||e.code))}
  blankTeam();ready=true;status("");
  setInterval(()=>saveNow(false),1500);
  document.addEventListener("visibilitychange",()=>{if(document.hidden)saveNow(false)});
})();
</script>
